# back#4: gate de CI — lint + tests + build en cada PR, y en cada push a
# main para que el badge del README refleje el estado real de la rama.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo cancela la corrida obsoleta del mismo PR; en main nunca se
# cancela, para que el badge no muestre un run "cancelled" tras merges seguidos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    # Nombre estable a propósito: es el nombre del check requerido en la
    # protección de main. NO renombrar sin actualizar Settings → Branches,
    # o el PR quedaría bloqueado por un check "faltante". El e2e va incluido
    # como step propio abajo.
    name: lint · test · build
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts exige DATABASE_URL al cargarse, pero `prisma generate`
      # no abre ninguna conexión: una URL dummy basta. La suite es unitaria
      # (los puertos se mockean), así que tampoco necesita Postgres real.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm test

      # back#24: el e2e (test:e2e, config aparte de la suite unitaria) vive
      # fuera del rootDir de `npm test`. Sin este paso, un e2e roto pasaba el
      # gate en verde (regresión del PR #25). Usa PrismaService mockeado —
      # no necesita Postgres real.
      - name: E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build
